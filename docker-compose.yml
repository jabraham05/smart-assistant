name: assistant

networks:
  assistant-net:
  # Ephemeral per-task sandbox containers join this network only — never
  # assistant-net. They have no legitimate reason to reach postgres/n8n/
  # Honcho, and this keeps that structurally true rather than just a
  # convention. Default bridge driver still NATs outbound (git clone,
  # package installs work normally), it's just not bridged to the other
  # services.
  #
  # Ollama is the one deliberate exception (see its own service block) -
  # OpenHands' agent-server container (openhands-runner's spawned
  # workspace) makes LLM calls in-process, unlike coding-orchestrator's
  # architecture where the orchestrator itself calls Ollama and only
  # relays resulting shell commands into the sandbox. Ollama holds no
  # secrets, unlike everything else this network is isolated from.
  sandbox-net:
    name: sandbox-net
    # Created manually per the README's setup step (`docker network create
    # sandbox-net`), not by compose - must be marked external or compose
    # refuses to attach any service to it ("exists but was not created by
    # compose").
    external: true

volumes:
  postgres-data:
  n8n-data:
  ollama-data:
  falkordb-data:

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks: [assistant-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [assistant-net]

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      # n8n's AI Agent node does not pass a bound model's own `numCtx`
      # option through when actually invoking it for tool-calling (only a
      # plain, non-tool chat completion honors a per-request num_ctx) -
      # confirmed directly: /api/ps showed context_length silently
      # falling back to Ollama's 4096 default specifically for Agent-
      # mediated tool calls, truncating longer prompts (long system
      # message + task/plan text + tool schemas) and producing empty,
      # confused output with zero tool calls attempted. This sets the
      # server-wide default so every model loads with enough context
      # regardless of which caller (or bug) fails to request one. Bumped
      # 8192 -> 16384 (not higher: checked actual GPU headroom via
      # nvidia-smi on this machine - a 12GB RTX 5070 with only ~4.3GB free
      # once qwen3:8b is resident under OLLAMA_KEEP_ALIVE=-1 - so this is a
      # real, evidence-sized step, not a guess). coding-orchestrator's
      # agent-loop.ts accumulates every tool call/result into the message
      # history across up to 25 iterations, which can plausibly exceed 8192
      # tokens well before a Coder/Tester round naturally finishes -
      # coding-orchestrator/src/ollama.ts now also sets this explicitly per
      # request (numCtx) rather than depending on this default implicitly.
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Also on sandbox-net (unlike every other assistant-net service) -
    # real, live-verified requirement: OpenHands' agent-server container
    # (spawned by openhands-runner, network-isolated to sandbox-net same as
    # sandbox-runner's own spawned containers) makes its own LLM calls
    # in-process, unlike coding-orchestrator's architecture where the
    # orchestrator itself calls Ollama and only relays resulting shell
    # commands into the sandbox. Ollama holds no secrets/credentials
    # (unlike Postgres/Honcho/GITHUB_TOKEN, all deliberately unreachable
    # from sandbox-net) - a narrow, justified exception, not a general
    # network merge.
    networks: [assistant-net, sandbox-net]

  # One-shot: forces the default model to load into VRAM right after startup,
  # so the very first real request doesn't pay the cold-load cost. Combined
  # with OLLAMA_KEEP_ALIVE=-1 above, the model then stays resident forever.
  ollama-warmup:
    image: ollama/ollama
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "run", "${OLLAMA_WARMUP_MODEL:-llama3.2:3b}", "hi"]
    networks: [assistant-net]

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: assistant
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      OLLAMA_HOST: http://ollama:11434
      # Landing repo for coding tasks with no existing target repo (a
      # from-scratch build) — coding_task_pipeline's "Prepare Row" node
      # reads this via $env when the webhook body omits repoUrl. Doesn't
      # need to be set on sandbox-runner: it's just a passthrough client,
      # n8n is what decides which repoUrl to send it.
      CODING_TASKS_REPO_URL: ${CODING_TASKS_REPO_URL}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on: [postgres, ollama, skills-mcp, sandbox-runner, coding-orchestrator]
    networks: [assistant-net]

  # MCP server hosting agent-callable tools (recall_user_memory, get_weather,
  # calendar CRUD). Internal-only: no published port, n8n's MCP Client Tool
  # node reaches it over assistant-net at http://skills-mcp:3001/mcp.
  skills-mcp:
    build:
      context: ./skills-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      HOME_LOCATION: ${HOME_LOCATION}
      HOME_LATITUDE: ${HOME_LATITUDE}
      HOME_LONGITUDE: ${HOME_LONGITUDE}
      SKILLS_PROPOSAL_WEBHOOK_URL: ${SKILLS_PROPOSAL_WEBHOOK_URL}
      # Calendar tools are optional — if GOOGLE_CALENDAR_ID is unset, they
      # return a clear error instead of the server failing to start. The key
      # file is baked into the image at build time (see skills-mcp/Dockerfile)
      # rather than bind-mounted — a runtime bind mount for this single file
      # got stuck as a directory on this machine's Docker Desktop, persisting
      # across container recreation.
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      GOOGLE_CALENDAR_KEY_FILE: /run/secrets/google-calendar-key.json
      # code_task_run_command/code_task_get_diff talk to sandbox-runner
      # directly (not through an n8n webhook) — always-on internal infra,
      # not a per-user optional integration, so no config-missing path.
      SANDBOX_RUNNER_URL: http://sandbox-runner:3002
      # spotify_control tools — also optional, clear error at call time if
      # unset. SPOTIFY_REFRESH_TOKEN comes from the one-time
      # scripts/spotify-auth.mjs bootstrap (see .env.example).
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN}
      # dashboard_control tool — also optional, clear error at call time if
      # unset. Points at the dashboard_control n8n workflow, which applies
      # smart-mirror widget layout changes and pushes them to the Pi.
      DASHBOARD_CONTROL_WEBHOOK_URL: ${DASHBOARD_CONTROL_WEBHOOK_URL}
      # web_search tool — also optional, clear error at call time if unset.
      # Free key at tavily.com (no card required for the free tier).
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # knowledge_search/knowledge_ingest/research_task/research_task_status
      # all talk to knowledge-engine directly (not through an n8n webhook) —
      # always-on internal infra, same tier as SANDBOX_RUNNER_URL/
      # EVENT_BUS_URL above, no config-missing path. Replaces the old
      # RESEARCH_TASK_WEBHOOK_URL/RESEARCH_TASK_STATUS_WEBHOOK_URL/
      # RESEARCH_SEARCH_WEBHOOK_URL vars that pointed at research_pipeline.
      KNOWLEDGE_ENGINE_URL: http://knowledge-engine:3005
      # memory_recall's manual retrieval path - same backend
      # chat-orchestrator's automatic per-turn retrieval uses.
      MEMORY_ENGINE_URL: http://memory-engine:3007
      # code_task/code_task_status/status_overview - direct to
      # coding-orchestrator, always-on internal infra, same tier as
      # KNOWLEDGE_ENGINE_URL. Real, live-verified finding (2026-09-26):
      # code_task/code_task_status used to submit through the old
      # coding_task_pipeline n8n workflow's webhook (CODING_TASK_WEBHOOK_URL/
      # CODING_TASK_STATUS_WEBHOOK_URL, both now retired) - a transient n8n
      # database outage silently swallowed every coding task submitted via
      # Discord, with no coding_tasks row ever created and no reply reaching
      # the user (the tool-call exception crashed the whole agent turn
      # before any response was generated). coding-orchestrator's own
      # POST /task and GET /task/status have existed and worked reliably
      # all session; both tools now call them directly.
      CODING_ORCHESTRATOR_URL: http://coding-orchestrator:3003
    networks: [assistant-net]

  # Docker-outside-of-Docker sandbox: spins up a fresh, disposable container
  # per coding task (clone -> apply diff -> run tests -> report -> destroy),
  # for the coding-agent pipeline (see README's coding-agent section).
  # docker.sock is mounted ONLY here, never into the containers this spawns.
  # Internal-only, reached by n8n over assistant-net at
  # http://sandbox-runner:3002.
  sandbox-runner:
    build:
      context: ./sandbox-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3002"
      SANDBOX_NETWORK: sandbox-net
      MAX_COMMANDS_PER_TASK: ${MAX_COMMANDS_PER_TASK:-250}
      # Deliberately set ONLY here, never on the n8n service — n8n stores
      # every workflow execution's full node inputs/outputs in Postgres in
      # plaintext, so this must never flow through a workflow's JSON body.
      # Only sandbox-runner itself ever sees it, for pushing an approved
      # branch and opening the resulting PR (see executor.ts).
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [assistant-net]

  # Owns the coding-agent pipeline's actual Planner->Coder->Tester->Reviewer->
  # retry state machine as real TypeScript (real try/catch/finally, one real
  # attempt loop) instead of an n8n node graph - replaces what
  # coding_task_pipeline used to do end-to-end. n8n keeps only a thin
  # submit/status webhook shim that proxies to this service; skills-mcp's
  # code_task/code_task_status tools are unchanged, since they still talk to
  # the same n8n webhook URLs as before. See README's "coding-orchestrator"
  # section for why this moved out of n8n.
  coding-orchestrator:
    build:
      context: ./coding-orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3003"
      OLLAMA_HOST: http://ollama:11434
      SANDBOX_RUNNER_URL: http://sandbox-runner:3002
      # Phase 2 of the infrastructure rebuild - wired into pipeline.ts but
      # off by default (see config.ts's useOpenHandsRunner). Existing-repo
      # tasks only; from-scratch tasks always use sandbox-runner regardless
      # of this flag, since openhands-runner doesn't implement sandbox-
      # runner's from-scratch template-seeding. Flip to "true" only after
      # the same soak-period validation agent-service (Phase 1) went
      # through before chat-orchestrator was ever pointed away from.
      USE_OPENHANDS_RUNNER: ${USE_OPENHANDS_RUNNER:-false}
      OPENHANDS_RUNNER_URL: http://openhands-runner:3011
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Dedicated database (see postgres/init/03-create-coding-tasks-db.sql),
      # not the old codingproposals1/codingtasklog01 n8n Data Tables.
      CODING_TASKS_DB_NAME: coding_tasks
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      CODING_TASKS_REPO_URL: ${CODING_TASKS_REPO_URL}
      # Deliberately absent: GITHUB_TOKEN. PR proposal still goes entirely
      # through sandbox-runner's/openhands-runner's own /propose-pr
      # endpoint, same as before - this service never receives or handles
      # the token itself.
    depends_on: [postgres, ollama, sandbox-runner]
    networks: [assistant-net]

  # Phase 2 of the infrastructure rebuild (see the plan co-designed and
  # live-verified this session) - wraps the OpenHands SDK as an alternative
  # coding execution engine to coding-orchestrator's own hand-rolled
  # Coder/Tester agent-loop. Wired into pipeline.ts, gated behind
  # coding-orchestrator's USE_OPENHANDS_RUNNER (off by default) - stays
  # off until proven the same way agent-service was (real fixture-repo
  # verification, live-verified this session against a real repo end to
  # end, plus a soak period) before the flag flips to "true" anywhere.
  #
  # Like sandbox-runner, needs docker.sock mounted (DockerWorkspace launches
  # OpenHands' own official agent-server container itself) and is the only
  # place GITHUB_TOKEN is set, for the same reason documented on
  # sandbox-runner below - n8n/any workflow-execution-persisting service
  # must never see it. The container DockerWorkspace launches joins
  # sandbox-net (SANDBOX_NETWORK), never assistant-net, and the token is
  # never forwarded into it - see task_runner.py's clone/push isolation.
  openhands-runner:
    build:
      context: ./openhands-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      PORT: "3011"
      OLLAMA_HOST: http://ollama:11434
      # qwen3:8b, not coding-orchestrator's qwen2.5-coder:7b - confirmed
      # live this session: qwen2.5-coder fails structurally with OpenHands
      # (narrates tool calls as prose instead of invoking them), qwen3:8b
      # makes real, correctly-executed tool calls end-to-end.
      CODER_MODEL: qwen3:8b
      SANDBOX_NETWORK: sandbox-net
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # Same defaults coding-orchestrator's own config.ts already uses -
      # `git commit` refuses to run without an identity configured, which
      # the spawned agent-server container has none of by default.
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-smart-assistant-bot}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-smart-assistant-bot@users.noreply.github.com}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [ollama]
    networks: [assistant-net]

  # Owns the events/goals subsystem: event ingestion, deterministic
  # classification, deterministic keyword-based goal matching, and the
  # stale-goal proactive nudge - see event-bus/ and README's "Event bus +
  # goals" section. Deliberately no Ollama dependency: no LLM call anywhere
  # in this service's hot path, by design.
  event-bus:
    build:
      context: ./event-bus
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3004"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Dedicated database (see postgres/init/04-create-events-db.sql).
      EVENT_BUS_DB_NAME: events
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      GOAL_STALE_DAYS: ${GOAL_STALE_DAYS:-7}
      SKILL_GAP_CHECK_MESSAGES: ${SKILL_GAP_CHECK_MESSAGES:-10}
      # Optional — only used to DM the owner directly when a high-priority
      # event has no origin_session_id to reply into (e.g. a CLI-triggered
      # coding task; see discord-notify.ts). Same bot/user id discord-bot
      # already uses, just also reaching this service.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_ALLOWED_USER_ID: ${DISCORD_ALLOWED_USER_ID}
      # Calendar poll-and-diff watcher + idle-time self-reflection - see
      # calendar-watch.ts and work-level.ts. All optional with sensible
      # defaults (see .env.example).
      SKILLS_MCP_URL: ${SKILLS_MCP_URL:-http://skills-mcp:3001}
      CALENDAR_REMINDER_LEAD_MINUTES: ${CALENDAR_REMINDER_LEAD_MINUTES:-30}
      CALENDAR_POLL_LOOKAHEAD_HOURS: ${CALENDAR_POLL_LOOKAHEAD_HOURS:-24}
      CODING_TASKS_DB_NAME: ${CODING_TASKS_DB_NAME:-coding_tasks}
      RESEARCH_DB_NAME: ${RESEARCH_DB_NAME:-research}
      IDLE_REFLECTION_MIN_HOURS: ${IDLE_REFLECTION_MIN_HOURS:-4}
      IDLE_REFLECTION_MESSAGE_MIN_HOURS: ${IDLE_REFLECTION_MESSAGE_MIN_HOURS:-24}
      # Overnight digest (digest.ts) - fires when calendar-watch.ts detects
      # a wake-marker calendar event starting soon. News section is
      # skipped (not an error) if TAVILY_API_KEY is unset.
      OVERNIGHT_DIGEST_MIN_HOURS: ${OVERNIGHT_DIGEST_MIN_HOURS:-20}
      OLLAMA_HOST: http://ollama:11434
      DIGEST_MODEL: ${DIGEST_MODEL:-qwen3:8b}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    depends_on: [postgres]
    networks: [assistant-net]

  # Owns document ingestion, chunking, embedding, hybrid retrieval, and the
  # research agent - replacing research_pipeline (see
  # docs/knowledge-engine.md). Reuses the existing `research` Postgres
  # database (pgvector already installed there) rather than provisioning a
  # new one. Internal-only, no published port; skills-mcp and n8n reach it
  # directly at http://knowledge-engine:3005, same pattern as goal_manage ->
  # event-bus (no n8n proxy workflow for this one).
  knowledge-engine:
    build:
      context: ./knowledge-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3005"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RESEARCH_DB_NAME: ${RESEARCH_DB_NAME:-research}
      OLLAMA_HOST: http://ollama:11434
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-nomic-embed-text}
      # Web-research escalation (see engine/router.ts) - optional, clear
      # error at call time if unset, same pattern as skills-mcp's web_search.
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      KNOWLEDGE_ROUTE_TO_WEB_THRESHOLD: ${KNOWLEDGE_ROUTE_TO_WEB_THRESHOLD}
      # notify.ts - posting a real follow-up into the chat session a
      # background research run was started from, once it finishes. Same
      # fields/pattern as coding-orchestrator's own notify.ts.
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      # notify.ts's logAwaitingDigest (deferred-notify path for
      # background=true research) - see event-bus's /overnight-digest-check.
      EVENT_BUS_URL: http://event-bus:3004
      # engine/consolidate.ts / lib/coding-orchestrator-client.ts - a
      # coding-activity project's approve/complete steps call
      # coding-orchestrator directly, not through the old n8n webhook shim.
      CODING_ORCHESTRATOR_URL: http://coding-orchestrator:3003
      # Phase 3 of the infrastructure rebuild - POST /projects/:id/approve
      # and engine/consolidate.ts's writeConsolidatedEpisode both fire
      # episode writes here.
      GRAPHITI_SERVICE_URL: http://graphiti-service:3012
    depends_on: [postgres, ollama, coding-orchestrator, graphiti-service]
    networks: [assistant-net]

  # Self-hosted cross-conversation memory retrieval - deliberately its own
  # service and its own database (`memory`), not a domain inside
  # knowledge-engine's `research` database, since knowledge-engine's own
  # scope explicitly excludes user-specific memory (world facts only).
  # Replaces Honcho's dialectic API for both chat-orchestrator's automatic
  # per-turn retrieval and the memory_recall MCP tool's manual path - one
  # backend for both. Honcho itself is unaffected: still owns the peer-card
  # profile summary and its own background consolidation. Internal-only,
  # no published port, same pattern as knowledge-engine/event-bus.
  memory-engine:
    build:
      context: ./memory-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3007"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MEMORY_DB_NAME: ${MEMORY_DB_NAME:-memory}
      OLLAMA_HOST: http://ollama:11434
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on: [postgres, ollama]
    networks: [assistant-net]

  # Self-hosted Home Assistant, phone-presence-only for now (see README's
  # "Home Assistant + presence" section). No new backend service needed on
  # this side to consume it — HA's own Automations POST zone enter/leave
  # events straight into event-bus's generic POST /events over
  # assistant-net, the same endpoint chat/coding-orchestrator already use.
  # Bind-mounted (not a named volume) so configuration.yaml/automations
  # can be edited directly from the host, same convention as
  # ./postgres/init. Docker Desktop on Windows doesn't support
  # network_mode: host (HA's recommended mode for full mDNS device
  # discovery) - irrelevant for presence-only scope since the companion
  # app connects via a manually-entered URL, not discovery.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant/config:/config
    networks: [assistant-net]

  # Replaces the old Chat n8n workflow's AI Agent + MCP Client Tool node for
  # tool-calling orchestration - see docs/chat-workflow.md's documented
  # qwen3:8b reliability history and docs/coding-agent-pipeline.md's
  # already-proven raw-Ollama-tool-loop pattern this reuses. skills-mcp
  # itself is unchanged; this is a second, better-behaved MCP client
  # consuming it directly. n8n's Chat workflow is left intact/importable as
  # an instant rollback for as long as needed - chat-ui/discord-bot only
  # get repointed here once this is proven end-to-end (see the plan).
  # Published on the host (unlike coding-orchestrator/knowledge-engine) so
  # scripts/chat.mjs can be pointed at it directly for testing
  # (N8N_CHAT_WEBHOOK_URL=http://localhost:3008/webhook) with zero script
  # changes, since it preserves the exact same request/NDJSON contract.
  # Host port 3008, not 3006 - 3006 is `dashboard`'s published port (see
  # that service below), unrelated to this change.
  chat-orchestrator:
    build:
      context: ./chat-orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3008:3006"
    environment:
      PORT: "3006"
      OLLAMA_HOST: http://ollama:11434
      SKILLS_MCP_URL: http://skills-mcp:3001
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 'public' - the real views onto n8n's live personas/skills Data
      # Tables (see postgres/init/10-add-chat-test-schema.sql).
      CHAT_DB_SCHEMA: public
      REDIS_HOST: redis
      REDIS_DB: "0"
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      EVENT_BUS_URL: http://event-bus:3004
      MEMORY_ENGINE_URL: http://memory-engine:3007
    depends_on: [postgres, redis, ollama, skills-mcp, event-bus, memory-engine]
    networks: [assistant-net]

  # Phase 1 of the infrastructure rebuild (PydanticAI as the agent runtime -
  # see the architecture co-designed in this session's plan). Now the live
  # backend for chat-ui/discord-bot (see their N8N_WEBHOOK_URL/
  # N8N_CHAT_WEBHOOK_URL below) - cut over after live smoke-testing surfaced
  # and fixed a real streaming bug (main.py silently dropped the first
  # chunk of every response - see its own comment on PartStartEvent).
  # chat-orchestrator is left running, unmodified, as the instant rollback:
  # see the webhook URL comments on chat-ui/discord-bot below.
  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      PORT: "3010"
      OLLAMA_HOST: http://ollama:11434
      SKILLS_MCP_URL: http://skills-mcp:3001
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CHAT_DB_SCHEMA: public
      REDIS_HOST: redis
      REDIS_DB: "2"
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      EVENT_BUS_URL: http://event-bus:3004
      MEMORY_ENGINE_URL: http://memory-engine:3007
      KNOWLEDGE_ENGINE_URL: http://knowledge-engine:3005
    depends_on: [postgres, redis, ollama, skills-mcp, event-bus, memory-engine]
    networks: [assistant-net]

  # Phase 3 of the infrastructure rebuild's storage backend - the graph
  # database graphiti-service (below) actually writes to. Picked over
  # Neo4j (a JVM service, too heavy given this machine's already-
  # documented resource contention) and over Kuzu (graphiti-core's own
  # embedded option - rejected after a real deprecation warning surfaced
  # live this session: "the upstream Kuzu project is no longer maintained,
  # migrate to Neo4j or FalkorDB"). Confirmed live this session as
  # genuinely lightweight: 163MB image, ~71MB idle memory. A Redis fork/
  # module, not compatible with and not a replacement for this project's
  # own `redis` service above - needs its own container.
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    networks: [assistant-net]

  # The write path for Phase 3's decision/project/growth ledger (see the
  # plan co-designed earlier this session) - a deliberate graph of
  # meaningful moments (project approved, goal created, project
  # consolidated), written by Amy's own code only at those moments, never
  # raw per-turn conversation ingestion. Additive to Honcho (still does
  # its own passive per-turn "dreaming," unchanged) and memory-engine
  # (raw hybrid recall, no LLM) - not a replacement for either. Live-
  # verified this session before any of this code was written: a real
  # add_episode call against this exact stack (FalkorDB + Ollama) correctly
  # extracted real entities/relationships from a test episode and a
  # search query correctly retrieved them back - see graphiti_client.py's
  # own comment for the full finding.
  graphiti-service:
    build:
      context: ./graphiti-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3012"
      OLLAMA_HOST: http://ollama:11434
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    depends_on: [ollama, falkordb]
    networks: [assistant-net]

  # Phase 4 of the infrastructure rebuild - the real HTTP fetch step behind
  # knowledge-engine's extractUrl (lib/html-extract.ts), replacing a plain
  # fetch() that had no JS rendering and no anti-bot evasion. Fetcher (no
  # browser, cheap) is the default path; StealthyFetcher (a real browser)
  # is only used as a fallback when the plain fetch fails or is blocked -
  # not bundled/used unconditionally. Returns raw HTML, not pre-extracted
  # content - real, live-verified finding this session: Scrapling's own
  # .markdown() conversion does NOT do Readability-style boilerplate
  # stripping (tested against a real Wikipedia article, it returned the
  # nav sidebar instead of the article), so knowledge-engine's own already-
  # proven JSDOM+Readability pass still does the actual article extraction,
  # just fed better-fetched HTML than a plain fetch() alone could get.
  # StealthyFetcher's browser genuinely works but adds a real ~658MB
  # footprint (baked into this image at build time, not downloaded lazily
  # on first fallback use - see Dockerfile) - a deliberate choice given
  # this machine's already-documented resource contention, not a
  # limitation forgotten about. Revisit if the plain-fetch path proves
  # insufficient often enough in practice to justify bundling both by
  # default instead of falling back.
  scrapling-service:
    build:
      context: ./scrapling-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3013"
    networks: [assistant-net]

  # Side-by-side test instance of the same image/codebase - differs only by
  # env var (CHAT_DB_SCHEMA/REDIS_DB), never a per-request flag. Lets a
  # persona/skill change be tried against chat_test.personas/chat_test.skills
  # (edit directly via SQL) without ever touching production data, and lets
  # tool-calling behavior be regression-tested without writing to the
  # production Redis session buffer. Known, accepted limitation: still
  # shares the same real Honcho workspace, skills-mcp, and Ollama as prod -
  # a test conversation still writes to Amy's real long-term memory and can
  # still trigger real-world tool side effects (a real calendar event, real
  # Spotify control). Not sandboxed by this change - see the plan.
  chat-orchestrator-test:
    build:
      context: ./chat-orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3009:3006"
    environment:
      PORT: "3006"
      OLLAMA_HOST: http://ollama:11434
      SKILLS_MCP_URL: http://skills-mcp:3001
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CHAT_DB_SCHEMA: chat_test
      REDIS_HOST: redis
      REDIS_DB: "1"
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      EVENT_BUS_URL: http://event-bus:3004
      MEMORY_ENGINE_URL: http://memory-engine:3007
    depends_on: [postgres, redis, ollama, skills-mcp, event-bus, memory-engine]
    networks: [assistant-net]

  chat-ui:
    build:
      # Repo root, not ./chat-ui - it now needs to COPY docs/ and README.md
      # from outside its own directory at build time for the Artifacts tab
      # (see chat-ui/Dockerfile), the same reason the old ops-dashboard's
      # build context was the repo root.
      context: .
      dockerfile: chat-ui/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Cut over from chat-orchestrator to agent-service (Phase 1 of the
      # infrastructure rebuild - PydanticAI, live-verified this session:
      # eval-harness parity was never formally run, but real live smoke
      # tests against a running agent-service - plain replies, a real
      # skills-mcp tool call, repeated requests - all came back clean after
      # fixing a real streaming bug found in the process, see main.py's own
      # comment on PartStartEvent). Identical NDJSON wire contract, so no
      # code change was needed here, only this URL. Rollback is one line:
      # revert to http://chat-orchestrator:3006/webhook (or further back,
      # n8n's own Chat workflow at
      # http://n8n:5678/webhook/370d9565-997b-4121-aca7-1128df3dc4ea/chat).
      N8N_WEBHOOK_URL: http://agent-service:3010/webhook
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      # Read-only event-bus visibility panel (see the "event-bus" toggle
      # in ChatWindow.tsx / GET /api/events) - a debugging/observability
      # surface, nothing here ever writes to event-bus.
      EVENT_BUS_URL: http://event-bus:3004
      # Read-only Agent Registry panel (see the "agent registry" toggle in
      # ChatWindow.tsx / GET /api/registry) - browses skills-mcp's real
      # registered-tool catalog via its plain GET /tools route, no MCP
      # session or tool call ever made from here.
      SKILLS_MCP_URL: http://skills-mcp:3001
    depends_on: [agent-service, event-bus, skills-mcp]
    networks: [assistant-net]

  # Discord bridge: lets the user talk to Amy from their phone over DM,
  # anywhere. Connects outbound to Discord's gateway (websocket) — no
  # published port, no public tunnel needed, same "n8n reached internally
  # over assistant-net" pattern as chat-ui, just a different client. Only
  # relays DMs from DISCORD_ALLOWED_USER_ID; everyone else is ignored.
  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_ALLOWED_USER_ID: ${DISCORD_ALLOWED_USER_ID}
      # Cut over to agent-service, same as chat-ui above - identical NDJSON
      # contract (chat-client.ts already documents it as such), so no code
      # change needed here either. Rollback: revert this one line to
      # http://chat-orchestrator:3006/webhook (or further back, n8n's own
      # http://n8n:5678/webhook/370d9565-997b-4121-aca7-1128df3dc4ea/chat).
      N8N_CHAT_WEBHOOK_URL: http://agent-service:3010/webhook
    depends_on: [agent-service]
    networks: [assistant-net]
