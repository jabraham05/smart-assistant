name: assistant

networks:
  assistant-net:
  # Ephemeral per-task sandbox containers join this network only — never
  # assistant-net. They have no legitimate reason to reach postgres/n8n/
  # ollama/Honcho, and this keeps that structurally true rather than just
  # a convention. Default bridge driver still NATs outbound (git clone,
  # package installs work normally), it's just not bridged to the other
  # services.
  sandbox-net:
    name: sandbox-net

volumes:
  postgres-data:
  n8n-data:
  ollama-data:

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks: [assistant-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [assistant-net]

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      # n8n's AI Agent node does not pass a bound model's own `numCtx`
      # option through when actually invoking it for tool-calling (only a
      # plain, non-tool chat completion honors a per-request num_ctx) -
      # confirmed directly: /api/ps showed context_length silently
      # falling back to Ollama's 4096 default specifically for Agent-
      # mediated tool calls, truncating longer prompts (long system
      # message + task/plan text + tool schemas) and producing empty,
      # confused output with zero tool calls attempted. This sets the
      # server-wide default so every model loads with enough context
      # regardless of which caller (or bug) fails to request one. Bumped
      # 8192 -> 16384 (not higher: checked actual GPU headroom via
      # nvidia-smi on this machine - a 12GB RTX 5070 with only ~4.3GB free
      # once qwen3:8b is resident under OLLAMA_KEEP_ALIVE=-1 - so this is a
      # real, evidence-sized step, not a guess). coding-orchestrator's
      # agent-loop.ts accumulates every tool call/result into the message
      # history across up to 25 iterations, which can plausibly exceed 8192
      # tokens well before a Coder/Tester round naturally finishes -
      # coding-orchestrator/src/ollama.ts now also sets this explicitly per
      # request (numCtx) rather than depending on this default implicitly.
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [assistant-net]

  # One-shot: forces the default model to load into VRAM right after startup,
  # so the very first real request doesn't pay the cold-load cost. Combined
  # with OLLAMA_KEEP_ALIVE=-1 above, the model then stays resident forever.
  ollama-warmup:
    image: ollama/ollama
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "run", "${OLLAMA_WARMUP_MODEL:-llama3.2:3b}", "hi"]
    networks: [assistant-net]

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: assistant
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      OLLAMA_HOST: http://ollama:11434
      # Landing repo for coding tasks with no existing target repo (a
      # from-scratch build) — coding_task_pipeline's "Prepare Row" node
      # reads this via $env when the webhook body omits repoUrl. Doesn't
      # need to be set on sandbox-runner: it's just a passthrough client,
      # n8n is what decides which repoUrl to send it.
      CODING_TASKS_REPO_URL: ${CODING_TASKS_REPO_URL}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on: [postgres, ollama, skills-mcp, sandbox-runner, coding-orchestrator]
    networks: [assistant-net]

  # MCP server hosting agent-callable tools (recall_user_memory, get_weather,
  # calendar CRUD). Internal-only: no published port, n8n's MCP Client Tool
  # node reaches it over assistant-net at http://skills-mcp:3001/mcp.
  skills-mcp:
    build:
      context: ./skills-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      HOME_LOCATION: ${HOME_LOCATION}
      HOME_LATITUDE: ${HOME_LATITUDE}
      HOME_LONGITUDE: ${HOME_LONGITUDE}
      SKILLS_PROPOSAL_WEBHOOK_URL: ${SKILLS_PROPOSAL_WEBHOOK_URL}
      # Calendar tools are optional — if GOOGLE_CALENDAR_ID is unset, they
      # return a clear error instead of the server failing to start. The key
      # file is baked into the image at build time (see skills-mcp/Dockerfile)
      # rather than bind-mounted — a runtime bind mount for this single file
      # got stuck as a directory on this machine's Docker Desktop, persisting
      # across container recreation.
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      GOOGLE_CALENDAR_KEY_FILE: /run/secrets/google-calendar-key.json
      # code_task is optional too — returns a clear error at call time if
      # unset, same pattern as the calendar tools.
      CODING_TASK_WEBHOOK_URL: ${CODING_TASK_WEBHOOK_URL}
      CODING_TASK_STATUS_WEBHOOK_URL: ${CODING_TASK_STATUS_WEBHOOK_URL}
      # code_task_run_command/code_task_get_diff talk to sandbox-runner
      # directly (not through an n8n webhook) — always-on internal infra,
      # not a per-user optional integration, so no config-missing path.
      SANDBOX_RUNNER_URL: http://sandbox-runner:3002
      # spotify_control tools — also optional, clear error at call time if
      # unset. SPOTIFY_REFRESH_TOKEN comes from the one-time
      # scripts/spotify-auth.mjs bootstrap (see .env.example).
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN}
      # dashboard_control tool — also optional, clear error at call time if
      # unset. Points at the dashboard_control n8n workflow, which applies
      # smart-mirror widget layout changes and pushes them to the Pi.
      DASHBOARD_CONTROL_WEBHOOK_URL: ${DASHBOARD_CONTROL_WEBHOOK_URL}
      # web_search tool — also optional, clear error at call time if unset.
      # Free key at tavily.com (no card required for the free tier).
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # research_task/research_task_status point at research_pipeline's
      # submit/status webhooks (fire-and-forget submit, synchronous poll,
      # same pattern as CODING_TASK_*). research_search is a synchronous
      # RAG query, usable any time mid-conversation, not scoped to a chat
      # session. All three optional — clear error at call time if unset.
      # See README's Research workflow section for the one-time research
      # database + pgvector setup these depend on.
      # TODO(knowledge-engine cutover): remove once research-task.ts/
      # research-task-status.ts/research-search.ts are rewritten to call
      # KNOWLEDGE_ENGINE_URL directly instead of these webhooks.
      RESEARCH_TASK_WEBHOOK_URL: ${RESEARCH_TASK_WEBHOOK_URL}
      RESEARCH_TASK_STATUS_WEBHOOK_URL: ${RESEARCH_TASK_STATUS_WEBHOOK_URL}
      RESEARCH_SEARCH_WEBHOOK_URL: ${RESEARCH_SEARCH_WEBHOOK_URL}
      # knowledge_search/knowledge_ingest talk to knowledge-engine directly
      # (not through an n8n webhook) — always-on internal infra, same tier
      # as SANDBOX_RUNNER_URL/EVENT_BUS_URL above, no config-missing path.
      KNOWLEDGE_ENGINE_URL: http://knowledge-engine:3005
    networks: [assistant-net]

  # Docker-outside-of-Docker sandbox: spins up a fresh, disposable container
  # per coding task (clone -> apply diff -> run tests -> report -> destroy),
  # for the coding-agent pipeline (see README's coding-agent section).
  # docker.sock is mounted ONLY here, never into the containers this spawns.
  # Internal-only, reached by n8n over assistant-net at
  # http://sandbox-runner:3002.
  sandbox-runner:
    build:
      context: ./sandbox-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3002"
      SANDBOX_NETWORK: sandbox-net
      MAX_COMMANDS_PER_TASK: ${MAX_COMMANDS_PER_TASK:-250}
      # Deliberately set ONLY here, never on the n8n service — n8n stores
      # every workflow execution's full node inputs/outputs in Postgres in
      # plaintext, so this must never flow through a workflow's JSON body.
      # Only sandbox-runner itself ever sees it, for pushing an approved
      # branch and opening the resulting PR (see executor.ts).
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [assistant-net]

  # Owns the coding-agent pipeline's actual Planner->Coder->Tester->Reviewer->
  # retry state machine as real TypeScript (real try/catch/finally, one real
  # attempt loop) instead of an n8n node graph - replaces what
  # coding_task_pipeline used to do end-to-end. n8n keeps only a thin
  # submit/status webhook shim that proxies to this service; skills-mcp's
  # code_task/code_task_status tools are unchanged, since they still talk to
  # the same n8n webhook URLs as before. See README's "coding-orchestrator"
  # section for why this moved out of n8n.
  coding-orchestrator:
    build:
      context: ./coding-orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3003"
      OLLAMA_HOST: http://ollama:11434
      SANDBOX_RUNNER_URL: http://sandbox-runner:3002
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Dedicated database (see postgres/init/03-create-coding-tasks-db.sql),
      # not the old codingproposals1/codingtasklog01 n8n Data Tables.
      CODING_TASKS_DB_NAME: coding_tasks
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      CODING_TASKS_REPO_URL: ${CODING_TASKS_REPO_URL}
      # Deliberately absent: GITHUB_TOKEN. PR proposal still goes entirely
      # through sandbox-runner's own /propose-pr endpoint, same as before -
      # this service never receives or handles the token itself.
    depends_on: [postgres, ollama, sandbox-runner]
    networks: [assistant-net]

  # Owns the events/goals subsystem: event ingestion, deterministic
  # classification, deterministic keyword-based goal matching, and the
  # stale-goal proactive nudge - see event-bus/ and README's "Event bus +
  # goals" section. Deliberately no Ollama dependency: no LLM call anywhere
  # in this service's hot path, by design.
  event-bus:
    build:
      context: ./event-bus
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3004"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Dedicated database (see postgres/init/04-create-events-db.sql).
      EVENT_BUS_DB_NAME: events
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
      GOAL_STALE_DAYS: ${GOAL_STALE_DAYS:-7}
      SKILL_GAP_CHECK_MESSAGES: ${SKILL_GAP_CHECK_MESSAGES:-10}
      # Optional — only used to DM the owner directly when a high-priority
      # event has no origin_session_id to reply into (e.g. a CLI-triggered
      # coding task; see discord-notify.ts). Same bot/user id discord-bot
      # already uses, just also reaching this service.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_ALLOWED_USER_ID: ${DISCORD_ALLOWED_USER_ID}
      # Calendar poll-and-diff watcher + idle-time self-reflection - see
      # calendar-watch.ts and work-level.ts. All optional with sensible
      # defaults (see .env.example).
      SKILLS_MCP_URL: ${SKILLS_MCP_URL:-http://skills-mcp:3001}
      CALENDAR_REMINDER_LEAD_MINUTES: ${CALENDAR_REMINDER_LEAD_MINUTES:-30}
      CALENDAR_POLL_LOOKAHEAD_HOURS: ${CALENDAR_POLL_LOOKAHEAD_HOURS:-24}
      CODING_TASKS_DB_NAME: ${CODING_TASKS_DB_NAME:-coding_tasks}
      RESEARCH_DB_NAME: ${RESEARCH_DB_NAME:-research}
      IDLE_REFLECTION_MIN_HOURS: ${IDLE_REFLECTION_MIN_HOURS:-4}
      IDLE_REFLECTION_MESSAGE_MIN_HOURS: ${IDLE_REFLECTION_MESSAGE_MIN_HOURS:-24}
    depends_on: [postgres]
    networks: [assistant-net]

  # Owns document ingestion, chunking, embedding, hybrid retrieval, and the
  # research agent - replacing research_pipeline (see
  # docs/knowledge-engine.md). Reuses the existing `research` Postgres
  # database (pgvector already installed there) rather than provisioning a
  # new one. Internal-only, no published port; skills-mcp and n8n reach it
  # directly at http://knowledge-engine:3005, same pattern as goal_manage ->
  # event-bus (no n8n proxy workflow for this one).
  knowledge-engine:
    build:
      context: ./knowledge-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3005"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RESEARCH_DB_NAME: ${RESEARCH_DB_NAME:-research}
      OLLAMA_HOST: http://ollama:11434
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-nomic-embed-text}
      # Web-research escalation (see engine/router.ts) - optional, clear
      # error at call time if unset, same pattern as skills-mcp's web_search.
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      KNOWLEDGE_ROUTE_TO_WEB_THRESHOLD: ${KNOWLEDGE_ROUTE_TO_WEB_THRESHOLD}
    depends_on: [postgres, ollama]
    networks: [assistant-net]

  # Self-hosted Home Assistant, phone-presence-only for now (see README's
  # "Home Assistant + presence" section). No new backend service needed on
  # this side to consume it — HA's own Automations POST zone enter/leave
  # events straight into event-bus's generic POST /events over
  # assistant-net, the same endpoint chat/coding-orchestrator already use.
  # Bind-mounted (not a named volume) so configuration.yaml/automations
  # can be edited directly from the host, same convention as
  # ./postgres/init. Docker Desktop on Windows doesn't support
  # network_mode: host (HA's recommended mode for full mDNS device
  # discovery) - irrelevant for presence-only scope since the companion
  # app connects via a manually-entered URL, not discovery.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant/config:/config
    networks: [assistant-net]

  chat-ui:
    build:
      context: ./chat-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/370d9565-997b-4121-aca7-1128df3dc4ea/chat
      HONCHO_API_KEY: ${HONCHO_API_KEY}
      HONCHO_WORKSPACE_ID: smart-assistant
    depends_on: [n8n]
    networks: [assistant-net]

  # Discord bridge: lets the user talk to Amy from their phone over DM,
  # anywhere. Connects outbound to Discord's gateway (websocket) — no
  # published port, no public tunnel needed, same "n8n reached internally
  # over assistant-net" pattern as chat-ui, just a different client. Only
  # relays DMs from DISCORD_ALLOWED_USER_ID; everyone else is ignored.
  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_ALLOWED_USER_ID: ${DISCORD_ALLOWED_USER_ID}
      N8N_CHAT_WEBHOOK_URL: http://n8n:5678/webhook/370d9565-997b-4121-aca7-1128df3dc4ea/chat
    depends_on: [n8n]
    networks: [assistant-net]
