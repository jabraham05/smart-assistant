# XcodeGen spec - the .xcodeproj is generated from this, never hand-edited.
# Regenerate after adding/removing files:  cd ios && xcodegen generate
name: Amy
options:
  bundleIdPrefix: com.jabraham
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Personal (free) team - automatic signing for installing on a real
    # iPhone. Free-team installs expire after 7 days; rebuild to renew.
    DEVELOPMENT_TEAM: 929HM4K559
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Amy:
    type: application
    platform: iOS
    sources: [Amy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jabraham.amy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  AmyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AmyTests]
    dependencies:
      - target: Amy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Amy:
    build:
      targets:
        Amy: all
        AmyTests: [test]
    test:
      targets: [AmyTests]
